# Cloudflare Pages + D1 配置
# 部署前把 database_id 换成你自己 D1 数据库的 ID（获取方式见 README 部署说明）

name = "chunge-member-center"
pages_build_output_dir = "public"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "chunge-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# R2 私有文件存储（先创建 chunge-private-files 桶；不需要 R2 时可整段注释）
[[r2_buckets]]
binding = "R2"
bucket_name = "chunge-private-files"
