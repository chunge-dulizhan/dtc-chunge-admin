# Cloudflare Pages + D1 配置
# 部署前把 database_id 换成你自己 D1 数据库的 ID（获取方式见 README 部署说明）

name = "chunge-member-center"
pages_build_output_dir = "public"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "chunge-db"
database_id = "9e47a6cc-a291-4a75-9cd8-cc1c959f49a9"

# R2 私有文件存储（可选：需要在 Cloudflare 控制台先创建桶 chunge-private-files，
# 然后把下面这段取消注释。未配置时网站其他功能不受影响，仅会员文件上传/下载不可用。）
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "chunge-private-files"
