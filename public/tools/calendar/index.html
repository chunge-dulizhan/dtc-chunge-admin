<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欧美全年节日营销日历｜独立站春哥</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body class="tool-page" data-tool="calendar">
<header class="t-bar">
  <a class="brand" href="/member/app/">
    <span class="brand-mark">春</span>
    <span class="brand-text"><span class="brand-name">独立站春哥</span><span class="brand-sub">MEMBER TOOLS</span></span>
  </a>
  <span class="t-badge">会员专享 · 微信 ch022427</span>
  <a class="t-back" href="/member/app/tools/">返回工具库</a>
</header>

<main class="t-main">
  <div class="t-head">
    <div class="t-eyebrow">Tool 04 / Calendar</div>
    <h1>欧美全年节日营销日历</h1>
    <p>按月查看欧美主要节日、建议备货节点与素材主题。节日营销至少提前 6-8 周准备，别等到节前才找货。</p>
    <div class="t-meta">
      <span class="t-chip">会员专属</span>
      <span class="t-chip">服务端计算</span>
      <span class="t-chip">更新 2026-11</span>
    </div>
  </div>

  <div class="t-grid">
    <section class="t-card">
      <h2>选择月份<span>查看当月节日与备货节奏</span></h2>
      <form class="t-form" data-tool-form>
        <label class="t-field">
          <span>月份</span>
          <select name="month">
            <option value="1">1 月</option>
            <option value="2">2 月</option>
            <option value="3">3 月</option>
            <option value="4">4 月</option>
            <option value="5">5 月</option>
            <option value="6">6 月</option>
            <option value="7">7 月</option>
            <option value="8">8 月</option>
            <option value="9">9 月</option>
            <option value="10">10 月</option>
            <option value="11">11 月</option>
            <option value="12">12 月</option>
          </select>
        </label>
        <div class="t-alert" data-role="alert" hidden></div>
        <button class="btn btn-primary btn-block t-submit" type="submit">查看月度日历</button>
      </form>
    </section>

    <section class="t-result" data-role="result">
      <div class="t-empty">选择月份后点击查看<br>这里会列出节日、日期与建议备货节点</div>
    </section>
  </div>

  <div class="t-foot">
    <span>© 2026 独立站春哥（亿级操盘手）｜带教咨询微信：ch022427</span>
    <span>复活节、Prime Day、光明节等日期每年浮动，以当年官方公告为准。</span>
  </div>
</main>

<script src="/assets/js/tools.js" defer></script>
</body>
</html>
