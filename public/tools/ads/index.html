<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook 广告计算器｜独立站春哥</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body class="tool-page" data-tool="ads">
<header class="t-bar">
  <a class="brand" href="/member/app/">
    <span class="brand-mark">春</span>
    <span class="brand-text"><span class="brand-name">独立站春哥</span><span class="brand-sub">MEMBER TOOLS</span></span>
  </a>
  <span class="t-badge">会员专享 · 微信 ch022427</span>
  <a class="t-back" href="/member/app/tools/">返回工具库</a>
</header>

<main class="t-main">
  <div class="t-head">
    <div class="t-eyebrow">Tool 02 / Meta Ads</div>
    <h1>Facebook 广告计算器</h1>
    <p>根据客单价、转化率与 CPC 估算单笔订单成本，判断当前模型能不能放量，以及 CPC 还有多少操作空间。</p>
    <div class="t-meta">
      <span class="t-chip">会员专属</span>
      <span class="t-chip">服务端计算</span>
      <span class="t-chip">更新 2026-11</span>
    </div>
  </div>

  <div class="t-grid">
    <section class="t-card">
      <h2>填写投放参数<span>转化率按「点击到下单」计算</span></h2>
      <form class="t-form" data-tool-form>
        <label class="t-field">
          <span>客单价（AOV）</span>
          <div class="t-input-wrap">
            <input type="number" name="aov" min="0.01" max="1000000" step="0.01" value="45.00" required>
            <em data-cur>USD</em>
          </div>
        </label>
        <label class="t-field">
          <span>转化率（点击到下单）</span>
          <div class="t-input-wrap">
            <input type="number" name="cvr" min="0.01" max="100" step="0.01" value="2.50" required>
            <em>%</em>
          </div>
        </label>
        <label class="t-field">
          <span>单次点击成本（CPC）</span>
          <div class="t-input-wrap">
            <input type="number" name="cpc" min="0.001" max="10000" step="0.001" value="0.90" required>
            <em data-cur>USD</em>
          </div>
        </label>
        <label class="t-field">
          <span>毛利率（用于计算保本 CPA）</span>
          <div class="t-input-wrap">
            <input type="number" name="gross_margin" min="0" max="100" step="0.1" value="45" required>
            <em>%</em>
          </div>
        </label>
        <label class="t-field">
          <span>币种</span>
          <select name="currency">
            <option value="USD" selected>USD 美元</option>
            <option value="EUR">EUR 欧元</option>
            <option value="GBP">GBP 英镑</option>
            <option value="CNY">CNY 人民币</option>
          </select>
        </label>
        <div class="t-alert" data-role="alert" hidden></div>
        <button class="btn btn-primary btn-block t-submit" type="submit">估算获客成本</button>
      </form>
    </section>

    <section class="t-result" data-role="result">
      <div class="t-empty">填写左侧参数后点击计算<br>结果会显示 CPA、保本 CPA 与可承受 CPC</div>
    </section>
  </div>

  <div class="t-foot">
    <span>© 2026 独立站春哥（亿级操盘手）｜带教咨询微信：ch022427</span>
    <span>计算基于单次点击模型，实际数据以广告后台为准。</span>
  </div>
</main>

<script src="/assets/js/tools.js" defer></script>
</body>
</html>
