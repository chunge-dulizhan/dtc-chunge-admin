<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>独立站产品定价计算器｜独立站春哥</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/tools.css">
</head>
<body class="tool-page" data-tool="pricing">
<header class="t-bar">
  <a class="brand" href="/member/app/">
    <span class="brand-mark">春</span>
    <span class="brand-text"><span class="brand-name">独立站春哥</span><span class="brand-sub">MEMBER TOOLS</span></span>
  </a>
  <span class="t-badge">会员专享 · 微信 ch022427</span>
  <a class="t-back" href="/member/app/tools/">返回工具库</a>
</header>

<main class="t-main">
  <div class="t-head">
    <div class="t-eyebrow">Tool 01 / Pricing</div>
    <h1>独立站产品定价计算器</h1>
    <p>把采购、物流、广告与交易费率一次性算进去，得到保本价与建议售价，避免「卖得越多亏得越多」。</p>
    <div class="t-meta">
      <span class="t-chip">会员专属</span>
      <span class="t-chip">服务端计算</span>
      <span class="t-chip">更新 2026-11</span>
    </div>
  </div>

  <div class="t-grid">
    <section class="t-card">
      <h2>填写成本参数<span>金额为单件成本，费率填百分比</span></h2>
      <form class="t-form" data-tool-form>
        <label class="t-field">
          <span>产品成本（含包装）</span>
          <div class="t-input-wrap">
            <input type="number" name="product_cost" min="0" max="1000000" step="0.01" value="8.50" required>
            <em data-cur>USD</em>
          </div>
        </label>
        <label class="t-field">
          <span>物流总成本（头程 + 尾程）</span>
          <div class="t-input-wrap">
            <input type="number" name="shipping_cost" min="0" max="1000000" step="0.01" value="4.20" required>
            <em data-cur>USD</em>
          </div>
        </label>
        <label class="t-field">
          <span>广告获客成本（每单）</span>
          <div class="t-input-wrap">
            <input type="number" name="ad_cost" min="0" max="1000000" step="0.01" value="9.00" required>
            <em data-cur>USD</em>
          </div>
        </label>
        <label class="t-field">
          <span>交易费率（收款 + 平台）</span>
          <div class="t-input-wrap">
            <input type="number" name="fee_rate" min="0" max="50" step="0.1" value="4" required>
            <em>%</em>
          </div>
        </label>
        <label class="t-field">
          <span>目标毛利率</span>
          <div class="t-input-wrap">
            <input type="number" name="target_margin" min="0" max="90" step="1" value="35" required>
            <em>%</em>
          </div>
        </label>
        <label class="t-field">
          <span>币种</span>
          <select name="currency">
            <option value="USD" selected>USD 美元</option>
            <option value="EUR">EUR 欧元</option>
            <option value="GBP">GBP 英镑</option>
            <option value="CNY">CNY 人民币</option>
          </select>
        </label>
        <div class="t-alert" data-role="alert" hidden></div>
        <button class="btn btn-primary btn-block t-submit" type="submit">计算建议售价</button>
      </form>
    </section>

    <section class="t-result" data-role="result">
      <div class="t-empty">填写左侧参数后点击计算<br>结果会显示建议售价、保本价与成本结构</div>
    </section>
  </div>

  <div class="t-foot">
    <span>© 2026 独立站春哥（亿级操盘手）｜带教咨询微信：ch022427</span>
    <span>计算结果仅供决策参考，实际以平台账单与物流报价为准。</span>
  </div>
</main>

<script src="/assets/js/tools.js" defer></script>
</body>
</html>
